name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # sentence-transformers pulls in torch; the default wheel bundles CUDA (~2 GB)
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      # The LLM API and the embedding model are replaced by fakes in the tests,
      # so CI needs no API key and downloads no model weights
      - name: Run tests
        run: pytest -v
